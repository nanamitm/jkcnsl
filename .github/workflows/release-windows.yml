name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish jkcnsl
        shell: pwsh
        run: >
          dotnet publish jkcnsl.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/jkcnsl

      - name: Publish JkcnslLoginWindow
        # JkcnslLoginWindow.exeは同じフォルダのjkcnsl.exeの設定を読み書きするので、
        # jkcnslと同じ出力先に置く。
        shell: pwsh
        run: >
          dotnet publish JkcnslLoginWindow/JkcnslLoginWindow.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReferencesDocumentationFiles=false
          -o dist/jkcnsl

      - name: Create ZIP
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') { $tag = 'manual-${{ github.run_number }}' }
          Compress-Archive -Path 'dist/jkcnsl' -DestinationPath "dist/jkcnsl-windows-x64-$tag.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jkcnsl-windows-x64
          path: dist/jkcnsl-windows-x64-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/jkcnsl-windows-x64-*.zip
