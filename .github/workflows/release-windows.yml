name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Publish jkcnsl
        shell: pwsh
        run: >
          dotnet publish jkcnsl.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/jkcnsl

      - name: Build and deploy browser login helper
        shell: pwsh
        run: |
          cmake -S qt-login-test -B build/qt-login -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt-login --config Release

          $loginDir = 'dist/jkcnsl/jkcnsl_login'
          New-Item -ItemType Directory -Force -Path $loginDir | Out-Null
          Copy-Item 'build/qt-login/jkcnsl-qt-login.exe' "$loginDir/jkcnsl-qt-login.exe"
          windeployqt --release --force "$loginDir/jkcnsl-qt-login.exe"

      - name: Create ZIP
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') { $tag = 'manual-${{ github.run_number }}' }
          Compress-Archive -Path 'dist/jkcnsl' -DestinationPath "dist/jkcnsl-windows-x64-$tag.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jkcnsl-windows-x64
          path: dist/jkcnsl-windows-x64-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/jkcnsl-windows-x64-*.zip
