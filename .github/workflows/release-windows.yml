name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Publish jkcnsl
        shell: pwsh
        run: >
          dotnet publish jkcnsl.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/jkcnsl

      - name: Build and deploy browser login helper
        shell: pwsh
        run: |
          cmake -S qt-login-test -B build/qt-login -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt-login --config Release

          $loginDir = 'dist/jkcnsl/jkcnsl_login'
          New-Item -ItemType Directory -Force -Path $loginDir | Out-Null
          Copy-Item 'build/qt-login/jkcnsl-qt-login.exe' "$loginDir/jkcnsl-qt-login.exe"
          windeployqt --release --force "$loginDir/jkcnsl-qt-login.exe"

      - name: Create ZIP
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') { $tag = 'manual-${{ github.run_number }}' }
          Compress-Archive -Path 'dist/jkcnsl' -DestinationPath "dist/jkcnsl-windows-x64-$tag.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jkcnsl-windows-x64
          path: dist/jkcnsl-windows-x64-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/jkcnsl-windows-x64-*.zip
